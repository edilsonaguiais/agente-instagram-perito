# Sobe o agente e o Caddy (HTTPS automático). Use pelo comando `agente-perito`.
# O Caddy só sobe com COMPOSE_PROFILES=caddy no .env (o instalador decide). Sem ele, o
# agente fica atrás de um proxy que já ocupa as portas 80/443 nesta máquina (veja o README).
services:
  perito:
    build: .
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
      - ./conhecimento:/app/conhecimento
      - ./dados:/app/dados
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    profiles: ["caddy"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
    depends_on:
      - perito

volumes:
  caddy_dados:
